<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নিউজ পোর্টাল - অ্যাডমিন প্যানেল</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Bar with Date and Social -->
    <div class="top-bar">
        <div class="container">
            <div class="current-date" id="current-date"></div>
            <ul class="social-links">
                <li><a href="https://web.facebook.com/mijanur.rahman.915304" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a></li>
                <li><a href="https://youtube.com" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a></li>
                <li><a href="https://twitter.com" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a></li>
                <li><a href="https://instagram.com" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a></li>
            </ul>
        </div>
    </div>

    <!-- Header with Logo and Search -->
    <header>
        <div class="navbar">
            <div class="container">
                <a href="index.html" class="logo-link">
                    <img src="images/logo.png" alt="নিউজ পোর্টাল" class="logo-img">
                </a>
                <button class="mobile-nav-toggle" type="button" aria-label="মেনু খুলুন" aria-expanded="false" aria-controls="primary-nav">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <div class="navbar-content" id="primary-nav">
                    <ul class="nav-links">
                        <li><a href="index.html">প্রচ্ছদ</a></li>
                        <li><a href="news.html">সব খবর</a></li>
                        <li><a href="admin.html" class="active">অ্যাডমিন</a></li>
                    </ul>
                    <button id="logout-btn" class="btn-logout" style="display:none;">লগ আউট</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="admin-wrapper">
                <!-- Login Section -->
                <div id="login-section" class="admin-section">
                    <div class="login-form">
                        <h2>অ্যাডমিন লগইন</h2>
                        <form id="login-form">
                            <div class="form-group">
                                <label for="username">ইউজারনেম:</label>
                                <input type="text" id="username" required>
                            </div>
                            <div class="form-group">
                                <label for="password">পাসওয়ার্ড:</label>
                                <input type="password" id="password" required>
                            </div>
                            <button type="submit" class="btn-submit">লগইন</button>
                        </form>
                        <p style="margin-top: 1rem; color: #666;">
                          
                        </p>
                    </div>
                </div>

                <!-- Admin Panel -->
                <div id="admin-panel" class="admin-section" style="display:none;">
                    <h2>নিউজ পোস্ট করুন</h2>
                    
                    <form id="news-form" class="news-form">
                        <div class="form-group">
                            <label for="title">খবরের শিরোনাম:</label>
                            <input type="text" id="title" placeholder="খবরের শিরোনাম লিখুন" required>
                        </div>

                        <div class="form-group">
                            <label for="description">বিবরণ:</label>
                            <textarea id="description" placeholder="বিস্তারিত বিবরণ লিখুন" rows="5" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="category">ক্যাটাগরি:</label>
                            <select id="category" required>
                                <option value="">নির্বাচন করুন</option>
                                <option value="national">জাতীয়</option>
                                <option value="international">আন্তর্জাতিক</option>
                                <option value="politics">রাজনীতি</option>
                                <option value="education">শিক্ষা</option>
                                <option value="health">স্বাস্থ্য</option>
                                <option value="sports">খেলা</option>
                                <option value="technology">প্রযুক্তি</option>
                                <option value="lifestyle">লাইফস্টাইল</option>
                                <option value="feature">ফিচার</option>
                                <option value="law">আইন</option>
                                <option value="religion">ধর্ম</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="image-url">ছবির লিংক (URL):</label>
                            <input type="url" id="image-url" placeholder="https://example.com/image.jpg">
                        </div>

                        <div class="form-group">
                            <label for="image-file">অথবা ছবি আপলোড করুন:</label>
                            <input type="file" id="image-file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp">
                        </div>

                        <div class="form-group">
                            <label for="author">লেখকের নাম:</label>
                            <input type="text" id="author" placeholder="আপনার নাম লিখুন">
                        </div>

                        <div class="form-actions">
                            <button type="submit" id="submit-news-btn" class="btn-submit">নিউজ পোস্ট করুন</button>
                            <button type="button" id="cancel-edit-btn" class="btn-cancel-edit" style="display:none;">এডিট বাতিল</button>
                        </div>
                    </form>

                    <!-- Recent News List -->
                    <div class="recent-news" style="margin-top: 3rem;">
                        <h3>সম্প্রতি পোস্ট করা খবর</h3>
                        <div id="admin-news-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

 <footer>
        <p style="text-align: center; color: #ffffff;">
            &copy; 2026 News Portal. All rights reserved.<br>
            <small style="font-size: 12px; color: #ffffff;">
                Developed by <a href="https://nurzamanportfolio.vercel.app/" style="color: #ffffff; text-decoration: none;">Nuruzzaman</a>
            </small>
        </p>
    </footer>
    <script src="mobile-nav.js"></script>
    <script src="data.js"></script>
    <script src="admin.js"></script>
</body>
</html>
