<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নিউজ বিবরণ - নিউজ পোর্টাল</title>
    
    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="নিউজ পোর্টাল">
    <meta property="og:description" content="সর্বশেষ খবর পড়ুন">
    <meta property="og:image" content="https://via.placeholder.com/1200x630?text=News+Portal">
    <meta property="og:url" content="">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="নিউজ পোর্টাল">
    <meta name="twitter:description" content="সর্বশেষ খবর পড়ুন">
    <meta name="twitter:image" content="https://via.placeholder.com/1200x630?text=News+Portal">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Bar with Date and Social -->
    <div class="top-bar">
        <div class="container">
            <div class="current-date" id="current-date"></div>
            <ul class="social-links">
                <li><a href="https://web.facebook.com/mijanur.rahman.915304" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a></li>
                <li><a href="https://youtube.com" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a></li>
                <li><a href="https://twitter.com" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a></li>
                <li><a href="https://instagram.com" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a></li>
            </ul>
        </div>
    </div>

    <!-- Header with Logo and Search -->
    <header>
        <div class="navbar">
            <div class="container">
                <a href="index.html" class="logo-link">
                    <img src="images/logo.png" alt="নিউজ পোর্টাল" class="logo-img">
                </a>
                <button class="mobile-nav-toggle" type="button" aria-label="মেনু খুলুন" aria-expanded="false" aria-controls="primary-nav">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <div class="navbar-content" id="primary-nav">
                    <ul class="nav-links">
                        <li><a href="index.html">প্রচ্ছদ</a></li>
                        <li><a href="news.html">সব খবর</a></li>
                        <li><a href="admin.html">অ্যাডমিন</a></li>
                    </ul>
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="খবর খুঁজুন...">
                        <button id="search-btn"><i class="fas fa-search"></i></button>
                    </div>
                </div>
            </div>
        </div>
        <div class="navbar-headline-bar">
            <div class="container navbar-headline-inner">
                <span class="navbar-headline-label">শিরোনাম</span>
                <div class="navbar-headline-ticker" aria-live="polite">
                    <div id="navbar-headline-track" class="navbar-headline-track is-static">
                        <a id="navbar-headline-link" class="navbar-headline-link" href="news.html">
                            <span id="navbar-headline-text">সর্বশেষ আপডেট লোড হচ্ছে...</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="detail-wrapper">
                <article class="news-detail">
                    <div class="detail-actions">
                        <button id="print-detail-btn" class="btn btn-print" title="প্রিন্ট করুন">
                            <i class="fas fa-print"></i> প্রিন্ট
                        </button>
                    </div>
                    <div id="detail-content">
                        <!-- খবরের বিস্তারিত এখানে লোড হবে -->
                        <p style="text-align: center; color: #666;">খবর লোড হচ্ছে...</p>
                    </div>
                </article>

                <!-- সাইডবার -->
                <aside class="detail-sidebar">
                    <div class="sidebar-section">
                        <h3 class="sidebar-title">📌 সম্পর্কিত খবর</h3>
                        <div id="related-news"></div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script src="github-sync.js"></script>
    <script src="mobile-nav.js"></script>
    <script src="navbar-headline.js"></script>
    <script src="print-pdf.js"></script>
    <script src="detail.js"></script>
    <script src="load-footer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initializeDetailPrintPDF();
        });
    </script>
</body>
</html>
