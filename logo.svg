<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <!-- Background -->
  <rect width="200" height="50" fill="#2c3e50" rx="4"/>
  
  <!-- Newspaper Icon -->
  <g transform="translate(10, 7)">
    <!-- Main paper -->
    <rect x="0" y="0" width="16" height="18" fill="white" stroke="#3498db" stroke-width="1.5" rx="1"/>
    
    <!-- Headline -->
    <line x1="2" y1="2" x2="14" y2="2" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Subheadlines -->
    <line x1="2" y1="5" x2="14" y2="5" stroke="#3498db" stroke-width="1" stroke-linecap="round"/>
    <line x1="2" y1="7" x2="14" y2="7" stroke="#3498db" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Content lines -->
    <line x1="2" y1="10" x2="10" y2="10" stroke="#95a5a6" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="2" y1="12" x2="10" y2="12" stroke="#95a5a6" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="2" y1="14" x2="10" y2="14" stroke="#95a5a6" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="2" y1="16" x2="8" y2="16" stroke="#95a5a6" stroke-width="0.8" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="38" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">নিউজ</text>
  <text x="38" y="33" font-family="Arial, sans-serif" font-size="10" fill="white">পোর্টাল</text>
</svg>
